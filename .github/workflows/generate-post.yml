name: Generate SEO article

on:
  schedule:
    - cron: "0 7 * * 2"   # once a week, Tuesday 07:00 UTC — slow, steady cadence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-post
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Add the publication date to the article and its card
        run: python3 scripts/backfill-dates.py

      - name: Translate it into every site language
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate-posts.mjs

      - name: List the journal in every language, six articles a page
        run: python3 scripts/paginate-blog.py

      - name: Cross-link the articles
        run: python3 scripts/link-articles.py

      - name: Link country pages to the journal
        run: python3 scripts/link-countries.py

      - name: Draw the share image
        run: |
          pip install --quiet pillow
          python3 scripts/make-og.py

      - name: One header on every page
        run: python3 scripts/sync-header.py

      - name: Language alternates and sitemap
        run: python3 scripts/build-alternates.py

      - name: Structural check
        run: |
          python3 scripts/check-pages.py
          python3 scripts/sync-header.py --check
          python3 scripts/check-css.py

      - name: Commit
        id: commit
        run: |
          git config user.name  "reprolegal-bot"
          git config user.email "bot@reprolegal.com"
          git add blog blog.html sitemap.xml content/topics.txt img/og countries ua de fr es it
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "content: new article"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with the built-in GITHUB_TOKEN does not trigger other
      # workflows, so the deploy has to happen here or the article never
      # reaches the site.
      - name: Deploy to Cloudflare
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
