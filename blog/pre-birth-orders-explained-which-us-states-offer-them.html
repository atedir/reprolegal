  <h1>Pre-birth orders explained: which US states offer them</h1>
  <p>A clear guide to US pre-birth orders for surrogacy, which states grant them, and why securing one before delivery protects intended parents legally.</p>
  <div style="margin-top:20px">
    <span class="views" id="views">—</span> <span class="views pubdate">· 16 August 2026</span> <span class="views pubdate">· 16 August 2026</span>
    <span class="views pubdate">· 16 August 2026 · 7 min</span>
  </div>
</div></div>
<section style="padding:80px 0"><div class="wrap"><div class="prose">
<h2>What is a pre-birth order?</h2>
<p>A pre-birth order (PBO) is a court judgement obtained during a surrogate's pregnancy that establishes the intended parents as the legal parents of the child before the birth occurs. When the order is in place, the intended parents' names are entered directly onto the birth certificate at the hospital, without any requirement to adopt the child or complete additional legal proceedings after delivery.</p>
<p>For international intended parents travelling to the United States for a surrogacy arrangement, a pre-birth order is frequently the single most consequential legal document in the entire process. It determines who is recognised as the child's parent the moment the child is born, and it shapes everything from the child's passport eligibility to inheritance rights and parental authority in a medical emergency.</p>

<h2>How a pre-birth order differs from a post-birth order</h2>
<p>In states that do not grant pre-birth orders, courts issue a post-birth order (also called a parentage order) after delivery. This means there is a window of time — sometimes days, sometimes several weeks — during which the legal parentage of the newborn remains unresolved. In that period, the surrogate may technically hold parental status under the law, even if no one in the arrangement intends that outcome.</p>
<p>Post-birth orders remain valid and widely used, but they introduce logistical complexity. The child may need a surrogate-linked birth certificate amended later, consular appointments may be delayed, and if the intended parents need to make urgent medical decisions immediately after birth, their authority to do so can be questioned without documented legal standing.</p>
<p>A pre-birth order removes that uncertainty. The order is typically filed in the second trimester, heard by a family or probate court, and finalised before the due date, allowing the hospital to act on clear, court-confirmed instructions from the moment of delivery.</p>

<h2>Which states grant pre-birth orders?</h2>
<p>As of writing, a number of US states have well-established practices of granting pre-birth orders in gestational surrogacy arrangements. The legal landscape continues to evolve and you should always confirm the current position with qualified local counsel before proceeding. States commonly noted for PBO-friendly environments include:</p>
<ul>
<li><strong>California</strong> — widely regarded as one of the most established surrogacy jurisdictions; pre-birth orders are routinely granted to married and unmarried intended parents, including same-sex couples and single individuals.</li>
<li><strong>Nevada</strong> — statutory framework explicitly supports gestational surrogacy agreements and pre-birth orders.</li>
<li><strong>Washington</strong> — state legislation enacted in recent years formalised PBO procedures.</li>
<li><strong>Maine, New Hampshire and Rhode Island</strong> — each has statutes or consistent court practice supporting PBOs.</li>
<li><strong>Connecticut</strong> — has a long-established surrogacy statute covering pre-birth parentage.</li>
<li><strong>Colorado</strong> — courts routinely grant PBOs in gestational arrangements.</li>
<li><strong>Illinois</strong> — the Gestational Surrogacy Act provides a clear statutory basis.</li>
<li><strong>Texas</strong> — courts in many counties will grant PBOs in gestational surrogacy; the picture is less uniform than in fully statutory states, and county-level variation is meaningful.</li>
<li><strong>Florida</strong> — available in gestational arrangements; certain statutory requirements must be met and legal guidance is essential.</li>
</ul>
<p>States such as Michigan, Louisiana and Nebraska have historically taken restrictive or uncertain positions on surrogacy contracts, and PBOs may not be available or reliable there as of writing. This list is illustrative, not exhaustive, and the law in individual states changes. Confirming current practice with an attorney licensed in the relevant state is essential before selecting a destination or clinic.</p>

<h2>Why state selection matters for international intended parents</h2>
<p>For intended parents who are not US citizens, the implications extend beyond domestic law. The child's citizenship and passport eligibility — in both the United States and the intended parents' home country — often depends on demonstrating a clear, unambiguous legal parentage relationship from birth.</p>
<p>Many consulates and immigration authorities look closely at the birth certificate and the underlying parentage order when processing a child's travel documents. A birth certificate listing the intended parents from birth, backed by a court-issued PBO, presents a cleaner evidentiary chain than an amended certificate issued weeks after delivery. This can meaningfully reduce delays in obtaining the child's passport and in completing the process needed to bring the child home.</p>
<p>The choice of state also affects the surrogate's legal exposure. In PBO-friendly states, a well-drafted surrogacy agreement is typically enforceable, and the surrogate's legal rights and obligations are clearly defined. This protects all parties and reduces the likelihood of post-birth disputes.</p>
<p>For a broader overview of how US surrogacy arrangements are structured, see our guide at <a href="/how-it-works">how it works</a>, and for destination-specific considerations, visit our <a href="/countries">countries</a> section.</p>

<h2>The process of obtaining a pre-birth order</h2>
<p>The exact procedure varies by state and county, but a typical sequence runs as follows:</p>
<ol>
<li>The surrogacy agreement is signed by all parties — intended parents, surrogate, and (where applicable) the surrogate's spouse — before the embryo transfer takes place.</li>
<li>Pregnancy is confirmed and the arrangement proceeds to the second trimester, generally around weeks 12 to 16.</li>
<li>The intended parents' reproductive attorney files a petition for parentage in the appropriate court, supported by the surrogacy agreement, genetic evidence (in gestational arrangements), and declarations from each party.</li>
<li>The court reviews the petition, sometimes holding a brief hearing and sometimes granting the order on the papers alone, depending on the jurisdiction.</li>
<li>The signed order is sent to the hospital of delivery before the due date, so that staff can complete the birth certificate in accordance with it.</li>
</ol>
<p>The timeline from petition to final order is typically four to twelve weeks, though this varies. Instructing a reproductive law attorney as early as possible — ideally before the embryo transfer — ensures that the legal process runs in parallel with the clinical one and is not rushed towards the end of the pregnancy.</p>

<h2>Costs and what to budget for</h2>
<p>Legal fees for obtaining a pre-birth order vary considerably depending on the state, the complexity of the case, and whether the intended parents are present in the US or represented remotely. Typical legal fees for a PBO in a straightforward gestational surrogacy range from approximately USD 3,000 to USD 7,000, though this is a general indication only and not a quote. Court filing fees, translator fees for foreign-language documents, and the cost of notarised declarations may add to this. For a fuller picture of the financial components of a US surrogacy arrangement, see our <a href="/costs">costs</a> page.</p>

<h2>What happens if a pre-birth order is not available</h2>
<p>If the arrangement is based in a state where a PBO cannot be obtained, or where the legal position is uncertain, a post-birth order remains an option. Experienced reproductive attorneys practising in those states will be familiar with the most efficient route to legal parentage. In some circumstances, intended parents complete a stepparent or second-parent adoption. The timeline is longer and the process more involved, but legal parentage is still achievable.</p>
<p>The key is not to assume that the absence of a PBO makes a state unsuitable, but rather to understand the full legal pathway before committing to a particular arrangement. For detailed questions about specific programmes and how legal processes are managed within them, our <a href="/programmes">programmes</a> page provides further guidance, and our <a href="/faq">FAQ</a> addresses many of the questions most commonly raised by international clients.</p>

<h2>Key points to carry forward</h2>
<ul>
<li>A pre-birth order establishes legal parentage before delivery, placing the intended parents' names directly on the birth certificate.</li>
<li>Not all US states grant them; the legal landscape varies significantly and changes over time.</li>
<li>For international intended parents, a PBO simplifies the child's passport and immigration process.</li>
<li>State and clinic selection should be made with the legal pathway firmly in view, not as an afterthought.</li>
<li>Always confirm the current legal position with a reproductive attorney licensed in the relevant state before proceeding.</li>
</ul>
